[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-lens"
version = "1.0.0-alpha"
description = "AI-powered smart glasses platform for elementary education"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "EduLens Team", email = "dev@edulens.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.9",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "isort>=5.12.0",
]

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output options
addopts = [
    "-v",                           # Verbose output
    "--strict-markers",             # Ensure all markers are registered
    "--tb=short",                   # Shorter traceback format
    "--cov=src",                    # Coverage for src directory
    "--cov=core",                   # Coverage for core directory
    "--cov=orchestrator",           # Coverage for orchestrator
    "--cov=agents",                 # Coverage for agents
    "--cov=utils",                  # Coverage for utils
    "--cov=database",               # Coverage for database
    "--cov-report=term-missing",    # Show missing lines in terminal
    "--cov-report=html:htmlcov",    # Generate HTML coverage report
    "--cov-report=xml",             # Generate XML coverage report for CI
    "--cov-fail-under=80",          # Fail if coverage is below 80%
    "--asyncio-mode=auto",          # Auto-detect async tests
]

# Markers for test categorization
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, require services)",
    "performance: Performance and benchmark tests",
    "safety: Safety and content moderation tests",
    "slow: Tests that take a long time to run",
    "audio: Audio processing tests",
    "vision: Computer vision tests",
    "curriculum: Curriculum and educational content tests",
    "ai: AI model integration tests",
    "database: Database interaction tests",
    "redis: Redis cache tests",
    "requires_api: Tests that require external API access",
    "requires_gpu: Tests that require GPU access",
]

# Async test configuration
asyncio_mode = "auto"

# Timeout configuration
timeout = 300
timeout_method = "thread"

# Warning filters
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Test collection configuration
norecursedirs = [
    ".*",
    "build",
    "dist",
    "*.egg",
    "venv",
    "env",
    "__pycache__",
    "node_modules",
]

# Logging
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["src", "core", "orchestrator", "agents", "utils", "database"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/conftest.py",
    "setup.py",
    "cli.py",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "redis.*",
    "sqlalchemy.*",
    "alembic.*",
    "pydantic.*",
    "loguru.*",
    "rich.*",
    "click.*",
    "pytest.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "FBT",    # flake8-boolean-trap
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "ISC",    # flake8-implicit-str-concat
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PD",     # pandas-vet
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # Ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "D",       # pydocstring (we'll add this later)
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicit string concatenation (conflicts with formatter)
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert detected
    "PLR2004", # Magic value used in comparison
    "ANN",     # Type annotations
    "ARG",     # Unused arguments
]
"migrations/**/*.py" = ["ANN", "D"]
"setup.py" = ["ANN", "D"]
"cli.py" = ["T20"]

[tool.ruff.isort]
known-first-party = ["src", "core", "orchestrator", "agents", "utils", "database"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | venv
  | env
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
known_first_party = ["src", "core", "orchestrator", "agents", "utils", "database"]
