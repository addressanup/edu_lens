# Alembic Configuration for Claude Agents Orchestration System

[alembic]
# Path to migration scripts
script_location = database/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Truncate names for long migration files
truncate_slug_length = 40

# Use timezone for migration timestamps
timezone = UTC

# Default database URL (can be overridden by environment variable)
sqlalchemy.url = sqlite:///./state.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Post-write hooks (optional)
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q
