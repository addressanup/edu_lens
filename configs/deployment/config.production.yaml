# EduLens Production Configuration
# IMPORTANT: Do not commit secrets - use environment variables

environment: production

# API Configuration
api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  timeout: 30
  cors_origins:
    - https://app.edulens.com
    - https://api.edulens.com

# Logging
logging:
  level: INFO
  format: json
  output: stdout
  include_timestamp: true
  include_request_id: true

# Vision Pipeline
vision:
  ocr:
    engine: tesseract
    languages: [eng]
    confidence_threshold: 0.85
  handwriting:
    model: edulens-hw-v1
    age_adaptation: true
    min_confidence: 0.80
  preprocessing:
    max_image_size: 4096
    auto_rotate: true
    denoise: true

# Audio Pipeline
audio:
  wake_word:
    model: edulens-wake-v1
    threshold: 0.92
    cooldown_ms: 1000
  asr:
    model: whisper-small
    language: en
    child_adaptation: true
  tts:
    engine: edge-tts
    voice: en-US-AnaNeural
    rate: 0.9
    pitch: 1.0

# AI Tutor
ai:
  model: edulens-tutor-v1
  max_tokens: 500
  temperature: 0.7
  timeout_seconds: 10
  fallback_responses: true

# Privacy & Security
privacy:
  data_retention_hours: 0  # No persistent storage
  encryption: AES-256-GCM
  anonymization: true
  coppa_compliant: true

security:
  tls_version: "1.3"
  certificate_validation: true
  rate_limiting:
    requests_per_minute: 60
    burst: 10

# Performance
performance:
  max_latency_ms: 2000
  memory_limit_mb: 512
  cpu_limit_percent: 80
  cache_enabled: true
  cache_ttl_seconds: 300

# Monitoring
monitoring:
  metrics_enabled: true
  metrics_port: 9090
  health_check_interval: 30
  alerts:
    latency_threshold_ms: 3000
    error_rate_threshold: 0.01
    memory_threshold_percent: 90
