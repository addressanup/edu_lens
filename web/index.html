<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLens AI Tutor Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: #4A90A4;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: #4A90A4;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .typing-indicator.show {
            display: inline-block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4A90A4;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .controls {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .input-container {
            padding: 15px 20px;
            background: white;
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-container input:focus {
            border-color: #4A90A4;
        }

        .input-container button {
            padding: 12px 24px;
            background: #4A90A4;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-container button:hover {
            background: #3d7a8c;
        }

        .input-container button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .session-info {
            padding: 10px 20px;
            background: #f0f0f0;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
            }
            body {
                padding: 0;
            }
            .chat-container {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EduLens AI Tutor</h1>
            <p>Your friendly learning buddy for ages 6-12</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <span class="message-label">EduLens</span>
                <div class="message-bubble">
                    Hi there! I'm EduLens, your learning buddy. I can help you with math, reading, science, and social studies. What would you like to learn today?
                </div>
            </div>
        </div>

        <div class="controls">
            <select id="ageSelect">
                <option value="6">Age: 6</option>
                <option value="7">Age: 7</option>
                <option value="8" selected>Age: 8</option>
                <option value="9">Age: 9</option>
                <option value="10">Age: 10</option>
                <option value="11">Age: 11</option>
                <option value="12">Age: 12</option>
            </select>
            <select id="subjectSelect">
                <option value="general">Subject: General</option>
                <option value="math">Math</option>
                <option value="reading">Reading</option>
                <option value="science">Science</option>
                <option value="social_studies">Social Studies</option>
            </select>
        </div>

        <div class="input-container">
            <input type="text" id="questionInput" placeholder="Ask me anything..." autofocus>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>

        <div class="session-info" id="sessionInfo">
            Session: Not started
        </div>
    </div>

    <script>
        let sessionId = null;
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');
        const sendButton = document.getElementById('sendButton');
        const sessionInfo = document.getElementById('sessionInfo');
        const ageSelect = document.getElementById('ageSelect');
        const subjectSelect = document.getElementById('subjectSelect');

        // Handle Enter key
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) {
                sendMessage();
            }
        });

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = isUser ? 'You' : 'EduLens';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);

            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';

            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = 'EduLens';

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator show';
            indicator.innerHTML = '<span></span><span></span><span></span>';

            typingDiv.appendChild(label);
            typingDiv.appendChild(indicator);
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Disable input while processing
            sendButton.disabled = true;
            questionInput.disabled = true;

            // Add user message
            addMessage(question, true);
            questionInput.value = '';

            // Show typing indicator
            showTyping();

            try {
                const response = await fetch('/api/v1/tutor/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: question,
                        session_id: sessionId,
                        student_age: parseInt(ageSelect.value),
                        subject: subjectSelect.value
                    })
                });

                const data = await response.json();

                // Hide typing indicator
                hideTyping();

                if (response.ok) {
                    // Update session ID
                    if (data.session_id && !sessionId) {
                        sessionId = data.session_id;
                        sessionInfo.textContent = `Session: ${sessionId.substring(0, 8)}...`;
                    }

                    // Add assistant response
                    addMessage(data.response, false);
                } else {
                    addMessage('Oops! Something went wrong. Please try again.', false);
                }
            } catch (error) {
                hideTyping();
                addMessage('Oops! Could not connect to the server. Please make sure the API is running.', false);
                console.error('Error:', error);
            }

            // Re-enable input
            sendButton.disabled = false;
            questionInput.disabled = false;
            questionInput.focus();
        }
    </script>
</body>
</html>
